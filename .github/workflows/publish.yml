name: Publish APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify
        run: |
          cat parts/part? > EitanShield.apk
          echo "$(cat parts/SHA256)  EitanShield.apk" | sha256sum -c -
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ github.run_number }}
          name: Eitan Shield ${{ github.run_number }}
          files: EitanShield.apk
